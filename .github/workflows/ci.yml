name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint · tipos · spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: specs/memory_schema.json sincronizado con los modelos
        run: python -m scripts.export_schema --check
      - name: esquemas experimentales sincronizados
        run: python -m scripts.export_experiment_schema --check

  test:
    name: tests · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pytest (sin extra embeddings; cobertura mínima 90 %)
        run: pytest --cov --cov-report=term
      - name: benchmark reproducible
        run: aal-benchmark --json --episodes 10

  mutation:
    name: mutaciones (las propiedades detectan defectos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m scripts.mutation_check

  embeddings:
    name: embeddings semánticos (fastembed)
    runs-on: ubuntu-latest
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed_cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .fastembed_cache
          key: fastembed-paraphrase-multilingual-MiniLM-L12-v2
      - run: pip install -e ".[dev,embeddings]"
      - run: pytest -m embeddings -v

  experiment:
    name: Experiment 1 A/B/C reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: python -m experiments run --seeds 7 --replicates 2 --evidence-dir evidence/ci
      - run: python -m experiments evaluate --evidence-dir evidence/ci --output results/ci
      - name: assert semantic reproducibility (not scientific improvement)
        run: >-
          python -c "import json;
          r=json.load(open('results/ci/experiment1.json'));
          assert r['replication']['replicated_groups'] == 18;
          assert r['replication']['all_semantic_projections_equal']"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment1-ci-evidence
          path: |
            evidence/ci/
            results/ci/
