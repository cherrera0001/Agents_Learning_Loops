<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="420" fill="#ffffff"/>
  <text x="40" y="40" font-size="16" font-weight="700" fill="#0f172a">Figura 7: Esquema del ciclo de memoria y operadores del solver determinista</text>
  <rect x="40" y="55" width="410" height="24" fill="#fef3c7" stroke="#f59e0b" rx="3"/>
  <text x="48" y="71" font-size="11" font-weight="700" fill="#b45309">ESQUEMA METODOLÓGICO (NO ES RESULTADO EXPERIMENTAL)</text>
  <rect x="50" y="130" width="140" height="70" fill="#f1f5f9" stroke="#e2e8f0" rx="5"/>
  <text x="120" y="160" font-size="12" font-weight="700" text-anchor="middle" fill="#0f172a">1. Entrada</text>
  <text x="120" y="180" font-size="10" text-anchor="middle" fill="#64748b">Issue / Excepción</text>
  <rect x="240" y="130" width="140" height="70" fill="#e0f2fe" stroke="#7dd3fc" rx="5"/>
  <text x="310" y="160" font-size="12" font-weight="700" text-anchor="middle" fill="#0f172a">2. Recuperación</text>
  <text x="310" y="180" font-size="10" text-anchor="middle" fill="#64748b">Similitud léxica</text>
  <rect x="430" y="130" width="140" height="70" fill="#fef08a" stroke="#facc15" rx="5"/>
  <text x="500" y="160" font-size="12" font-weight="700" text-anchor="middle" fill="#854d0e">3. Actuación</text>
  <text x="500" y="180" font-size="10" text-anchor="middle" fill="#64748b">3 operadores AST</text>
  <rect x="610" y="130" width="140" height="70" fill="#dcfce7" stroke="#86efac" rx="5"/>
  <text x="680" y="160" font-size="12" font-weight="700" text-anchor="middle" fill="#15803d">4. Verificación</text>
  <text x="680" y="180" font-size="10" text-anchor="middle" fill="#64748b">Test pass / fail</text>
  <rect x="330" y="260" width="160" height="60" fill="#f3e8ff" stroke="#d8b4fe" rx="5"/>
  <text x="410" y="285" font-size="12" font-weight="700" text-anchor="middle" fill="#6b21a8">5. Registro / Grafo</text>
  <text x="410" y="303" font-size="10" text-anchor="middle" fill="#64748b">Lección (éxito) / Fallo</text>
  <line x1="190" y1="165" x2="230" y2="165" stroke="#64748b" stroke-width="2"/>
  <line x1="380" y1="165" x2="420" y2="165" stroke="#64748b" stroke-width="2"/>
  <line x1="570" y1="165" x2="600" y2="165" stroke="#64748b" stroke-width="2"/>
  <path d="M 680 200 L 680 290 L 500 290" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M 330 290 L 120 290 L 120 210" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="40" y="405" font-size="10" fill="#64748b">Esquema ilustrativo del bucle de aprendizaje. Regenerar: python -m scripts.paper_figures</text>
