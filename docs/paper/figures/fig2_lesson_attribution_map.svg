  <text x="55" y="365" font-size="11" fill="#64748b">Hallazgo clave: Tanto B como C citaron la lección señuelo en el 100% de las ejecuciones, resultando en tasa de acierto cero al primer intento.</text>
  <text x="40" y="406" font-size="10" fill="#64748b">Origen: campaña reference-v2 (#44, #46) (solver determinista de 3 operadores, sin LLM). Conteos exactos de diseño exhaustivo. Regenerar: python -m scripts.paper_figures</text>
