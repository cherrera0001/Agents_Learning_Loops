[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "associative-agent-loop"
version = "0.2.0"
description = "Memoria asociativa en grafo para bucles de aprendizaje de agentes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Embeddings locales (ONNX, sin PyTorch). Alternativa: sentence-transformers.
embeddings = ["fastembed>=0.4"]
paper = ["matplotlib>=3.8"]
# scripts/kaggle_submission.py: lee el YAML del envío igual que el compilador del organizador. Sin él,
# `verify` falla cerrado (la comprobación de herramientas no puede correr).
kaggle = ["pyyaml>=6.0"]
dev = [
    "pyyaml>=6.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    "jsonschema>=4.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
aal-benchmark = "associative_agent_loop.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "embeddings: requiere el extra [embeddings]; se omite si fastembed no está instalado",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [
    "learning",
    # Generado por replicas_c7/armar_notebook.py (su fuente notebook_c7.py sí se lintea; el
    # artefacto se valida con kaggle_preflight antes de subir).
    "experiments/gemma_developer_agent/replicas_c7/notebook_c7.ipynb",
    # Mismo caso para los notebooks generados de las variantes (fuentes notebook_c7_*.py).
    "experiments/gemma_developer_agent/replicas_c7_nav/notebook_c7_nav.ipynb",
    "experiments/gemma_developer_agent/replicas_c7_presupuesto/notebook_c7_presupuesto.ipynb",
    "experiments/gemma_developer_agent/replicas_c7_thinking/notebook_c7_thinking.ipynb",
    "experiments/gemma_developer_agent/replicas_c7_forrajeo/notebook_c7_forrajeo.ipynb",
    # Directorio local de hooks de Codex; no está trackeado (CI no lo ve) y no es fuente del repo.
    ".codex",
    # Guiones de apoyo del concilio 2026-10-17 (analisis_c7/guiones_concilio_2026-10-17/): son
    # artefactos de reproducibilidad escritos por los roles del staff; se validan reejecutándolos,
    # no linteándolos (mismo precedente que los notebooks generados).
    "experiments/gemma_developer_agent/analisis_c7/guiones_concilio_2026-10-17",
    # Generado por replicas_c7_r1fiel/armar_notebook_r1fiel.py (sexto brazo R1-fiel).
    "experiments/gemma_developer_agent/replicas_c7_r1fiel/notebook_c7_r1fiel.ipynb",
    # Generado por replicas_c7_12b/armar_notebook_12b.py (brazo 12B, variante de modelo).
    "experiments/gemma_developer_agent/replicas_c7_12b/notebook_c7_12b.ipynb",
    # Generado por replicas_c7_hibrido/armar_notebook_hibrido.py (brazo híbrido, decisión (b)).
    "experiments/gemma_developer_agent/replicas_c7_hibrido/notebook_c7_hibrido.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # caracteres Unicode ambiguos: el texto es en español (·, →, ≥, ...)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
files = ["src/associative_agent_loop"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["networkx", "networkx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Extra opcional: no se sigue (arrastra stubs de numpy con sintaxis 3.12).
module = ["fastembed", "fastembed.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["associative_agent_loop"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
